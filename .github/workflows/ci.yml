name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-api.txt pytest httpx
      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t warehouse-demand-api .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api warehouse-demand-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf "localhost:8000/forecast?days=7" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['days'])==7; print('forecast ok')"